<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TOS Bodyguard</title>
  <!--
    Why not <script src="https://cdn.tailwindcss.com">?
    Manifest V3 forbids remotely-hosted code in extension pages
    (CSP: script-src 'self'), so the Tailwind Play CDN is blocked in popups.
    We ship popup.css — a tiny local stylesheet providing the Tailwind-compatible
    utility classes used below. To use the full framework, bundle Tailwind's
    compiled CSS at build time (e.g. `npx tailwindcss -o popup.css --minify`).
  -->
  <link rel="stylesheet" href="popup.css" />
</head>
<body class="w-80 bg-slate-50 font-sans text-slate-800">

  <header class="flex items-center gap-2 bg-indigo-600 px-4 py-3 text-white">
    <span class="text-xl" aria-hidden="true">🛡️</span>
    <div class="flex-1 min-w-0">
      <h1 class="text-sm font-bold leading-tight">TOS Bodyguard</h1>
      <p id="hostname" class="truncate text-xs text-indigo-200">…</p>
    </div>
    <button
      id="settings-toggle"
      class="rounded-lg px-2 py-1 text-sm text-indigo-200 transition-colors hover:bg-indigo-700"
      type="button" title="Settings" aria-label="Settings"
    >⚙️</button>
  </header>

  <!-- Shown when the service worker is older than the popup (needs reload) -->
  <div id="reload-banner" class="hidden bg-amber-100 px-4 py-2 text-xs text-amber-700">
    Extension was updated —
    <button id="reload-ext" type="button" class="font-semibold underline">reload to activate</button>,
    then refresh the page.
  </div>

  <!-- AI provider settings (hidden until ⚙️) -->
  <section id="settings" class="hidden border-b border-slate-200 bg-white px-4 py-3">
    <label class="mb-1 block text-xs font-semibold text-slate-700" for="provider">AI Provider</label>
    <select id="provider" class="mb-2 w-full rounded-lg border border-slate-300 bg-white px-2 py-1 text-sm">
      <option value="nano">Built-in Gemini Nano (free, on-device, slower)</option>
      <option value="gemini">Google Gemini API (fast, full document)</option>
      <option value="groq">Groq API (fast, full document)</option>
      <option value="openai">OpenAI API (fast, full document)</option>
      <option value="minimax">MiniMax API (fast, full document)</option>
    </select>
    <div id="key-fields" class="hidden">
      <label class="mb-1 block text-xs font-semibold text-slate-700" for="api-key">API key</label>
      <input id="api-key" type="password" autocomplete="off" placeholder="Paste your API key"
        class="mb-2 w-full rounded-lg border border-slate-300 px-2 py-1 text-sm" />
      <label class="mb-1 block text-xs font-semibold text-slate-700" for="model">Model</label>
      <input id="model" type="text" autocomplete="off"
        class="mb-2 w-full rounded-lg border border-slate-300 px-2 py-1 text-sm" />
      <p class="mb-2 text-xs text-slate-400">
        Key stays in this browser and is only sent to the provider. With a cloud
        provider, policy text leaves your device for analysis.
      </p>
      <div class="flex items-center gap-2">
        <button id="test-key" type="button"
          class="rounded-lg border border-slate-300 px-3 py-1 text-xs font-semibold text-slate-600 transition-colors hover:bg-slate-100">Test key</button>
      </div>
    </div>
    <div class="mt-2 flex items-center gap-2">
      <button id="save-settings" type="button"
        class="rounded-lg bg-indigo-600 px-3 py-1 text-xs font-semibold text-white transition-colors hover:bg-indigo-700">Save</button>
      <span id="settings-status" class="text-xs text-slate-500"></span>
    </div>
  </section>

  <!-- Live AI queue (rendered by popup.js; hidden when idle) -->
  <section id="queue" class="hidden border-t border-indigo-500 bg-indigo-50 px-4 py-2"></section>

  <!-- Rendered by popup.js: loading / results / empty / error states -->
  <main id="content" class="max-h-96 overflow-y-auto p-4"></main>

  <footer class="px-4 pb-4">
    <button
      id="scan-btn"
      class="w-full rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white transition-colors hover:bg-indigo-700 disabled:opacity-50"
      type="button"
    >
      🔍 Scan Current Page
    </button>
    <p id="engine-note" class="mt-2 text-center text-xs text-slate-400">
      Engine: on-device Gemini Nano
    </p>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
